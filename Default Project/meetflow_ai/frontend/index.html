<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MeetFlow AI</title><link rel="stylesheet" href="css/style.css"></head><body><aside class="sidebar"><div class="brand"><span class="logo">✦</span> MeetFlow <small>AI</small></div><nav id="nav"><button data-page="dashboard" class="active">⌂ Dashboard</button><button data-page="meetings">▤ Meetings</button><button data-page="decisions">◈ Decision memory</button><button data-page="conflicts">⚠ Conflict review <b id="conflictBadge"></b></button><button data-page="tasks">▦ Task board</button><button data-page="schedule">📅 Schedule</button><button data-page="digest">☷ Weekly digest</button></nav><div class="sidebar-foot">Meeting intelligence<br><span>Built for teams</span></div></aside><main><header><div><span class="eyebrow">WORKSPACE / OVERVIEW</span><h1 id="pageTitle">Dashboard</h1></div><button class="primary" id="newMeeting">＋ New meeting</button></header><section id="content"></section></main><button id="chatToggle" class="chat-toggle">✦ Ask MeetFlow</button><section id="chatPanel" class="chat-panel hidden"><div class="chat-head"><b>✦ MeetFlow AI</b><button id="chatClose">×</button></div><div id="chatMessages" class="chat-messages"><div class="bubble ai">Ask me about decisions, commitments, or meeting context.</div></div><form id="chatForm"><input id="chatInput" placeholder="Ask about your meetings…"><button class="primary">Send</button></form></section><dialog id="meetingDialog"><form method="dialog" id="meetingForm"><div class="dialog-head"><h2>Process a meeting</h2><button class="close" value="cancel">×</button></div><label>Meeting title<input id="meetingTitle" required placeholder="e.g. Sprint planning"></label><label>Date<input id="meetingDate" type="date"></label><label>Transcript<textarea id="meetingTranscript" required rows="9" placeholder="Paste speaker-labelled meeting notes…"></textarea></label><p class="muted">AI extraction uses your configured API key, or an offline parser when no key is configured.</p><div class="actions"><button value="cancel" class="secondary">Cancel</button><button id="submitMeeting" type="submit" class="primary">Analyze meeting</button></div></form></dialog><script src="js/app.js"></script></body></html>
